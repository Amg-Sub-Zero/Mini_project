<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan History — ScamShield</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/history.css" />
  <script>
    if (!localStorage.getItem('access_token')) {
      window.location.replace('login.html');
    }
  </script>
</head>
<body class="dashboard-body">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">🛡️ ScamShield</div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item">🏠 Dashboard</a>
      <a href="detector.html" class="nav-item">🔍 Scam Detector</a>
      <a href="history.html" class="nav-item active">📋 Scan History</a>
      <a href="profile.html" class="nav-item">👤 Profile</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-item logout" onclick="logout()">🚪 Logout</a>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main-wrapper">

    <header class="topbar">
      <button class="sidebar-toggle" id="sidebarToggle">☰</button>
      <span class="topbar-brand">ScamShield</span>
      <div class="topbar-right-group">
        <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
        <a href="profile.html" class="topbar-right">
          <div class="topbar-avatar" id="topbarUser"></div>
        </a>
      </div>
    </header>

    <main class="dashboard-main">

      <div class="history-header">
        <div>
          <h1>Scan History</h1>
          <p>A full log of everything you've scanned.</p>
        </div>
        <button class="btn btn-outline btn-sm" id="clearBtn">🗑 Clear History</button>
      </div>

      <!-- FILTERS -->
      <div class="history-filters">
        <input type="text" id="searchInput" class="filter-input" placeholder="🔍  Search scans..." />
        <select id="filterResult" class="filter-select">
          <option value="all">All Results</option>
          <option value="scam">Scam</option>
          <option value="suspicious">Suspicious</option>
          <option value="safe">Safe</option>
        </select>
        <select id="filterType" class="filter-select">
          <option value="all">All Types</option>
          <option value="Message">Message</option>
          <option value="Email">Email</option>
          <option value="Link">Link</option>
        </select>
      </div>

      <!-- TABLE -->
      <div class="recent-section">
        <div class="table-wrapper">
          <table class="scans-table">
            <thead>
              <tr>
                <th>What was scanned</th>
                <th>Type</th>
                <th>Result</th>
                <th>Risk Score</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
        <div class="history-count" id="historyCount"></div>
      </div>

    </main>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
