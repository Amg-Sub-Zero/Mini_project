<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ScamShield</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">🛡️ ScamShield</a>
    <h1>Welcome back</h1>
    <p class="auth-sub">Sign in to your account</p>

    <div class="auth-error" id="loginError" style="display:none;">
      ❌ Invalid email or password.
    </div>

    <div class="auth-success" id="registerSuccess" style="display:none;">
      ✅ Account created! Check your email to verify your account before logging in.
    </div>

    <form class="auth-form" id="loginForm" onsubmit="return false">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="loginPassword" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Login</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Register</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
