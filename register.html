<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - ScamShield</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html" class="auth-logo">🛡️ ScamShield</a>
    <h1>Create account</h1>
    <p class="auth-sub">Join ScamShield and stay protected</p>

    <div class="auth-success" id="registerSuccess" style="display:none;">
      ✅ Account created! <a href="login.html">Login now</a>
    </div>

    <div class="auth-error" id="registerError" style="display:none;"></div>

    <form class="auth-form" id="registerForm">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required />
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <div class="password-wrapper">
          <input type="password" id="regPassword" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePassword('regPassword', this)">👁</button>
        </div>
      </div>
      <div class="form-group">
        <label for="regConfirm">Confirm Password</label>
        <div class="password-wrapper">
          <input type="password" id="regConfirm" placeholder="••••••••" required />
          <button type="button" class="toggle-pw" onclick="togglePassword('regConfirm', this)">👁</button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
